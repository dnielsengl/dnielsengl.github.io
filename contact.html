<style>

    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}

@font-face{
    font-family:'Inter';
    font-style:normal;
    font-weight:400 800;
    font-display:swap;
    src:url('fonts/inter-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
}

:root{
    --navy:#0a2540;
    --navy-light:#123a63;
    --blue:#0b63c9;
    --blue-light:#eef4fb;
    --green:#22c55e;
    --text:#1f2937;
    --muted:#64748b;
    --bg:#f5f7fa;
}

*{box-sizing:border-box;}

body{
    font-family:'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    margin:0;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
}

a{color:inherit;}

header{
    background:var(--navy);
    color:white;
    padding:18px 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
}

.logo{font-weight:800; font-size:1.15rem; letter-spacing:.2px; text-decoration:none; color:white;}
.logo span{color:#5eb3ff;}

nav a{color:#cfe0f5; margin-left:24px; text-decoration:none; font-weight:600; font-size:.95rem; padding-bottom:4px;}
nav a:hover{color:white;}
nav a.active{color:white; border-bottom:2px solid var(--green);}

.page-header{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 55%, #1a4d85 100%);
    color:white; padding:56px 24px; text-align:center;
}

.page-header h1{margin:0 0 10px; font-size:2.1rem;}
.page-header p{color:#cfe0f5; max-width:520px; margin:0 auto; font-size:1.05rem;}

.container{max-width:600px; margin:0 auto; padding:60px 24px;}

.form-card{
    background:white; border:1px solid #e3e9f0; border-radius:14px; padding:36px;
    box-shadow:0 4px 20px rgba(10,37,64,.06);
}

.field{margin-bottom:20px;}
.field label{display:block; font-weight:700; font-size:.9rem; margin-bottom:6px; color:var(--navy);}

.field input, .field textarea{
    width:100%; padding:11px 14px; border:1px solid #d7dee7; border-radius:8px;
    font-family:inherit; font-size:.98rem; color:var(--text); background:var(--bg);
}

.field input:focus, .field textarea:focus{outline:2px solid var(--blue); outline-offset:1px; background:white;}

.field textarea{resize:vertical;}

.btn{
    display:inline-block; padding:13px 28px; border-radius:8px; font-weight:700;
    text-decoration:none; font-size:.95rem; border:none; cursor:pointer; width:100%;
}

.btn-primary{background:var(--green); color:#052e16;}
.btn-primary:hover{background:#1fae52;}

footer{
    background:var(--navy); color:#9fb7d1; text-align:center; padding:30px; font-size:.85rem;
    border-top:1px solid rgba(255,255,255,.08);
}

<body>

<header>
<a href="index.html" class="logo">KNITS <span>| Kalaallit Nunaanni IT Service</span></a>
<nav>
<a href="index.html">Forside</a>
<a href="about.html">Om os</a>
<a href="contact.html" class="active">Kontakt</a>
</nav>
</header>

<section class="page-header">
<h1>Send os en besked</h1>
<p>Skriv til os, hvis I ønsker et uforpligtende tilbud — vi svarer hurtigt.</p>
</section>

<div class="container">
<div class="form-card">
<form id="kontakt-form">

    <div class="field">
        <label for="name">Navn</label>
        <input type="text" id="name" name="name" required>
    </div>

    <div class="field">
        <label for="tlfnr">Tlf.nr.</label>
        <input type="text" id="tlfnr" name="tlfnr" required>
    </div>

    <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email">
    </div>

    <div class="field">
        <label for="message">Besked</label>
        <textarea id="message" name="message" placeholder="Skriv en kort besked om hvad du ønsker hjælp til her" rows="6" required></textarea>
    </div>

    <div class="cf-turnstile" data-sitekey="0x4AAAAAAEHZQmZBfYk5U_Qr" style="margin-bottom:16px;"></div>

    <p id="kontakt-fejl" style="display:none; color:#b91c1c; font-size:.9rem; margin-bottom:14px;"></p>

    <button type="submit" class="btn btn-primary" id="kontakt-send">Send besked</button>
</form>
</div>
</div>

<script>
document.getElementById('kontakt-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var knap = document.getElementById('kontakt-send');
    var fejlTekst = document.getElementById('kontakt-fejl');
    fejlTekst.style.display = 'none';
    knap.disabled = true;
    knap.textContent = 'Sender...';

    fetch('https://deni5-f8f9fzcefnf5babj.denmarkeast-01.azurewebsites.net/kontakt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            navn: document.getElementById('name').value,
            tlfnr: document.getElementById('tlfnr').value,
            email: document.getElementById('email').value,
            besked: document.getElementById('message').value,
            turnstileToken: (document.querySelector('[name="cf-turnstile-response"]') || {}).value,
        }),
    })
        .then(function (svar) {
            if (!svar.ok) throw new Error('Serverfejl');
            window.location.href = 'thankyou.html';
        })
        .catch(function () {
            fejlTekst.textContent = 'Kunne ikke sende beskeden lige nu — prøv igen om lidt, eller skriv direkte til kontakt@knits.gl.';
            fejlTekst.style.display = 'block';
            knap.disabled = false;
            knap.textContent = 'Send besked';
            if (window.turnstile) window.turnstile.reset();
        });
});
</script>
